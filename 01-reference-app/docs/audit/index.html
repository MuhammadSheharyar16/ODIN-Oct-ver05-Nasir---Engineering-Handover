<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ODIN Screen Audit</title>
<style>
:root{--bg:#0a0f22;--ink:#eef3ff;--ink2:#b9c6e4;--card:#121a36;--line:#26315a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f6fb;--ink:#0f1b2d;--ink2:#475467;--card:#fff;--line:#dfe4ef}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
main{max-width:1600px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:26px} h2{margin:32px 0 12px;font-size:18px} p{margin:0;color:var(--ink2)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.c{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.c img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
figcaption{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
figcaption em{flex-basis:100%;font-style:normal;color:var(--ink2);font-size:13px}
.s{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.s-green{color:#12a15a} .s-red{color:#d0453b} .s-amber{color:#c98a12} .s-out,.s-system{color:var(--ink2)}
</style></head><body><main>
